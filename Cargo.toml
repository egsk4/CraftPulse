[package]
name = "craftpulse"
version = "0.1.0"
edition = "2021"
description = "Discord Rich Presence for the ArtCraft creative apps"
license = "MIT"

[[bin]]
name = "craftpulse"
path = "src/main.rs"

[dependencies]
dirs = "6"
discord-rich-presence = "0.2.5"
getrandom = "0.3"
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tao = "0.34"
tiny_http = "0.12"
toml_edit = { version = "0.22", features = ["serde"] }
tray-icon = "0.21"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
filetime = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
