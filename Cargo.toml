[package]
name = "craftpulse"
version = "0.6.0"
edition = "2021"
build = "src/build.rs"
description = "Discord Rich Presence for the ArtCraft creative apps"
license = "MIT"

[[bin]]
name = "craftpulse"
path = "src/main.rs"

[dependencies]
tempfile = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Restart reminders: Windows toast, macOS notification, Linux D-Bus.
notify-rust = "4"
dirs = "6"
discord-rich-presence = "0.2.5"
getrandom = "0.3"
open = "5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
tao = "0.34"
tiny_http = "0.12"
ureq = "2"
toml_edit = { version = "0.22", features = ["serde"] }
tray-icon = "0.21"

[target.'cfg(target_os = "linux")'.dependencies]
wry = "0.53"
# Idle time on Wayland (ext-idle-notify-v1). Pure Rust, no system library needed.
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[target.'cfg(windows)'.dependencies]
# Small settings popup (a borderless WebView2 window) above the tray icon.
wry = "0.53"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
filetime = "0.2"

# Embeds assets/icon.ico into craftpulse.exe (see build.rs).
[build-dependencies]
winresource = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
