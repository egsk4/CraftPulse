name: Build CraftPulse

on: [push, pull_request]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - name: Install Linux tray build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libxdo-dev libgtk-3-dev libx11-dev libwebkit2gtk-4.1-dev
      - name: Test
        working-directory: .
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Clippy
        working-directory: .
        run: cargo clippy --locked --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Build
        working-directory: .
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: craftpulse-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/craftpulse*
