name: Release
on:
  push:
    tags: ['CraftPulse-v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    uses: ./.github/workflows/build.yml
  arch:
    uses: ./.github/workflows/arch.yml
  publish:
    needs: [build, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: Package executables and checksums
        run: python3 scripts/package_release.py
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; keeping its downloads and notes unchanged."
            exit 0
          fi
          args=()
          version="${GITHUB_REF_NAME#CraftPulse-v}"
          if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" release-output/* --verify-tag \
            --title "CraftPulse ${GITHUB_REF_NAME#CraftPulse-}" \
            "${args[@]}" --notes-file RELEASE_NOTES.md
