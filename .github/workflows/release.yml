name: Release
on:
  push:
    tags: ['CraftPulse-v*']
permissions:
  contents: read
jobs:
  build:
    uses: ./.github/workflows/build.yml
  arch:
    uses: ./.github/workflows/arch.yml
  publish:
    needs: [build, arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-input
      - name: Package executables and checksums
        run: python3 scripts/package_release.py
      - name: Publish alpha release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-output/* --verify-tag \
            --title "CraftPulse ${GITHUB_REF_NAME#CraftPulse-} (alpha)" \
            --prerelease --notes-file RELEASE_NOTES.md
      - name: Remove superseded unused v0.4.3 release after publishing v0.4.2
        if: github.ref_name == 'CraftPulse-v0.4.2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete CraftPulse-v0.4.3 --cleanup-tag --yes
